<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gyro MIDI Controller</title>
</head>
<body>
  <button id="startBtn">START GYRO + MIDI</button>
  <select id="midiOutputs"></select>
  <div id="status">Ready</div>
  
  <script>
   let midiAccess = null;
let selectedOutput = null;

// 1. Request MIDI access + populate output selector
async function initMidi() {
  try {
    midiAccess = await navigator.requestMIDIAccess();
    const select = document.getElementById('midiOutputs');
    
    // Clear and populate MIDI outputs
    select.innerHTML = '';
    for (let output of midiAccess.outputs.values()) {
      const option = document.createElement('option');
      option.value = output.id;
      option.textContent = output.name || `MIDI Output ${output.id}`;
      select.appendChild(option);
    }
    
    // Default to first output
    if (select.options.length > 0) {
      selectedOutput = midiAccess.outputs.get(select.value);
      select.onchange = () => {
        selectedOutput = midiAccess.outputs.get(select.value);
      };
    }
  } catch (err) {
    updateStatus(`MIDI error: ${err.message}`);
  }
}

// 2. Map gyroscope data to 5 MIDI CCs
function sendGyroAsMidi(event) {
  const { beta, gamma, alpha } = event.rotationRate; // x, y, z rotation (rad/s)
  
  // Convert raw gyro values (±max) to MIDI 0-127
  const mapToMidi = (val, maxVal = 5) => 
    Math.max(0, Math.min(127, Math.round((val / maxVal) * 63.5 + 63.5)));
  
  // Generate 5 CC values (customize mappings as needed)
  const ccValues = [
    mapToMidi(beta),    // CC#1: X-rotation (beta)
    mapToMidi(gamma),   // CC#2: Y-rotation (gamma)
    mapToMidi(alpha),   // CC#3: Z-rotation (alpha)
    mapToMidi(beta + gamma), // CC#4: Combined X+Y
    mapToMidi(Math.hypot(beta, gamma, alpha)) // CC#5: Total rotation magnitude
  ];
  
  // Send all 5 CCs (CC#0-127 are free; avoid CC#0/32/120-127 for safety)
  ccValues.forEach((value, index) => {
    if (selectedOutput) {
      selectedOutput.send([0xB0, 10 + index, value]); // 0xB0 = CC, channel 1
    }
  });
}

// 3. Start everything on user tap
document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    // Request motion permission (triggers iOS prompt)
    await DeviceMotionEvent.requestPermission?.();
    
    // Start listening to gyroscope
    window.addEventListener('devicemotion', sendGyroAsMidi);
    
    // Initialize MIDI
    await initMidi();
    
    updateStatus("Gyro + MIDI active!");
  } catch (err) {
    updateStatus(`Error: ${err.message}`);
  }
});

function updateStatus(msg) {
  document.getElementById('status').textContent = msg;
}
  </script>
</body>
</html>
